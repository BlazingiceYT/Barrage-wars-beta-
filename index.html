<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slowroads (Local)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #89c7ff; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.35); color: #fff; padding: 10px 12px; border-radius: 10px; }
    #hud kbd { background: rgba(255,255,255,.15); padding: 2px 6px; border-radius: 6px; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div><strong>Slowroads – local build</strong></div>
    <div><kbd>↑/W</kbd> accelerate · <kbd>↓/S</kbd> brake · <kbd>←/A</kbd> <kbd>→/D</kbd> steer</div>
  </div>
  <script src="./src/game.js"></script>
</body>
</html>
